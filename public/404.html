<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Anjrich The Toy Store</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404s back to root index preserving query string and path
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #FAF9F7; color: #111827;">
    <div style="text-align: center;">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Redirecting to Anjrich The Toy Store...</h2>
      <p style="color: #6B7280;">Please wait while we take you to the homepage.</p>
    </div>
  </body>
</html>
